[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "energy-management-v3"
version = "3.0.0"
description = "V3 工业能源管理系统：LangGraph + 5 Agent + 200x 时间引擎"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.5,<3",
  "pulp>=2.8,<4",
  "openpyxl>=3.1,<4",
  "websockets>=12,<14",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
