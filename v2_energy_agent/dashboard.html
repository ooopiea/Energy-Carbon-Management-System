<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V2 园区能源调度 · 实时控制台</title>
<style>
:root{
  --bg:#0e1410; --surface:#161d18; --surface2:#1d2722; --border:#28332d;
  --fg:#dde5dd; --fg2:#7a8a80; --fg3:#506058;
  --node:#3dd9c4; --energy:#f0a830; --carbon:#7ab87a; --human:#e8835f; --danger:#e85f5f;
  --node-d:#1a6b5e; --energy-d:#5e4316; --carbon-d:#2f4a2f; --human-d:#5e3424;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:300;line-height:1.5;min-height:100vh}
.mono{font-family:'Cascadia Code','Consolas','DejaVu Sans Mono',monospace}
.wrap{max-width:1440px;margin:0 auto;padding:24px 28px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap;gap:16px}
.brand{display:flex;align-items:baseline;gap:14px}
.brand h1{font-size:22px;font-weight:600;letter-spacing:-.3px}
.brand .ver{font-family:'Cascadia Code',monospace;font-size:11px;color:var(--node);background:var(--node-d);padding:2px 8px;border-radius:3px;font-weight:500}
/* 控制栏 */
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.controls label{font-size:11px;color:var(--fg2);margin-right:4px}
.controls input[type=date],.controls select{background:var(--surface2);border:1px solid var(--border);color:var(--fg);padding:7px 10px;border-radius:5px;font-size:13px;font-family:inherit}
.btn{padding:8px 18px;border:none;border-radius:5px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s}
.btn.primary{background:var(--node);color:#0e1410}
.btn.primary:hover{filter:brightness(1.15)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.approve{background:var(--node-d);color:var(--node);border:1px solid var(--node)}
.btn.reject{background:#5e2424;color:var(--danger);border:1px solid var(--danger)}
.btn.revise{background:var(--energy-d);color:var(--energy);border:1px solid var(--energy)}
.btn.ghost{background:transparent;color:var(--fg2);border:1px solid var(--border)}
.btn.ghost:hover{color:var(--fg);border-color:var(--fg3)}
/* 状态条 */
.status-bar{display:flex;align-items:center;gap:16px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:20px;flex-wrap:wrap}
.status-bar .pill{font-family:'Cascadia Code',monospace;font-size:11px;padding:3px 9px;border-radius:3px;background:var(--surface2);color:var(--fg2)}
.status-bar .pill.run{color:var(--node);background:var(--node-d)}
.status-bar .pill.warn{color:var(--human);background:var(--human-d)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
.dot.ok{background:var(--node);box-shadow:0 0 8px var(--node)}
.dot.wait{background:var(--human);box-shadow:0 0 8px var(--human);animation:pulse 1.5s infinite}
.dot.err{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* 布局 */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
@media(max-width:768px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px 14px}
.kpi .label{font-size:11px;color:var(--fg2);margin-bottom:6px}
.kpi .val{font-family:'Cascadia Code',monospace;font-size:22px;font-weight:500}
.kpi .val.pos{color:var(--energy)}
.kpi .val.neg{color:var(--danger)}
.kpi .val.carbon{color:var(--carbon)}
.kpi .sub{font-size:10px;color:var(--fg3);margin-top:4px}
.grid-main{display:grid;grid-template-columns:1fr 380px;gap:24px;margin-bottom:28px}
@media(max-width:1100px){.grid-main{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px}
.panel-title{font-size:12px;font-weight:500;color:var(--fg2);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px}
#graph-svg{width:100%;height:auto;display:block}
.node-rect{transition:all .2s;cursor:pointer}
.node-rect:hover{filter:brightness(1.3)}
.edge-line{transition:all .2s;cursor:pointer}
.edge-label{font-size:9px;fill:var(--fg2);font-family:'Cascadia Code',monospace}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.step:hover{background:var(--surface2)}
.step:last-child{border-bottom:none}
.step-dot{width:10px;height:10px;border-radius:50%;background:var(--node);margin-top:4px;flex-shrink:0}
.step-dot.human{background:var(--human)}
.step-dot.failed{background:var(--danger)}
.step .st-title{font-size:13px;font-weight:500}
.step .st-detail{font-size:11px;color:var(--fg2)}
.step.active{background:var(--surface2);border-left:2px solid var(--node);padding-left:8px}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:900px){.chart-row{grid-template-columns:1fr}}
.chart-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px}
.chart-box h3{font-size:13px;font-weight:500;margin-bottom:4px}
.chart-box .desc{font-size:11px;color:var(--fg2);margin-bottom:12px}
canvas{width:100%;height:260px;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--fg2)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:3px;border-radius:1px;display:inline-block}
.tooltip{position:fixed;background:#0a0e0c;border:1px solid var(--node);border-radius:6px;padding:10px 14px;font-size:12px;pointer-events:none;z-index:100;max-width:320px;box-shadow:0 4px 20px rgba(0,0,0,.5);display:none;line-height:1.5}
.tooltip strong{color:var(--node);font-size:13px;display:block;margin-bottom:4px}
.tooltip .tt-type{color:var(--fg3);font-size:10px;font-family:'Cascadia Code',monospace;text-transform:uppercase}
.approval-box{background:var(--surface);border:1px solid var(--human-d);border-radius:8px;padding:20px;margin-bottom:20px}
.approval-box h3{color:var(--human);font-size:14px;margin-bottom:12px}
.approval-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:12px}
.approval-actions .field{display:flex;flex-direction:column;gap:4px}
.approval-actions input,.approval-actions textarea{background:var(--surface2);border:1px solid var(--border);color:var(--fg);padding:7px 10px;border-radius:5px;font-size:12px;font-family:inherit}
.approval-actions textarea{min-width:280px;min-height:36px;resize:vertical}
.decision-tag{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:4px;font-size:12px;font-weight:500;font-family:'Cascadia Code',monospace}
.decision-tag.approve{background:var(--node-d);color:var(--node)}
.decision-tag.revise{background:var(--energy-d);color:var(--energy)}
.decision-tag.reject{background:#5e2424;color:var(--danger)}
.note{font-size:12px;color:var(--fg2);padding:12px 16px;background:var(--surface2);border-left:3px solid var(--fg3);border-radius:0 4px 4px 0;margin:12px 0}
.note strong{color:var(--fg)}
.tariff-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
@media(max-width:768px){.tariff-grid{grid-template-columns:repeat(2,1fr)}}
.empty{text-align:center;padding:60px 20px;color:var(--fg3);font-size:14px}
footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--border);font-size:11px;color:var(--fg3);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--fg3);border-top-color:var(--node);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg-btn{padding:5px 10px;border:none;background:var(--surface2);color:var(--fg2);cursor:pointer;font-size:12px;border-right:1px solid var(--border);transition:background .15s}
.seg-btn:last-child{border-right:none}
.seg-btn.active{background:var(--node);color:#fff;font-weight:600}
.seg-btn:hover{filter:brightness(1.2)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>园区能源调度</h1>
      <span class="ver">V2 LIVE</span>
      <span class="mono" style="font-size:11px;color:var(--fg2)">MILP + 电碳双因子 + LangGraph</span>
    </div>
    <div class="controls">
      <div><label>日期</label><input type="date" id="d-date"></div>
      <div><label>优化目标</label><select id="d-obj">
        <option value="min_cost">最低电费</option>
        <option value="min_carbon">最低碳排放</option>
        <option value="limit_peak_demand">削峰</option>
        <option value="weighted">综合加权</option>
      </select></div>
      <div><label>场景</label><div class="seg">
        <button type="button" class="seg-btn active" data-sc="A" onclick="pickScenario('A')">A 分时+现状</button>
        <button type="button" class="seg-btn" data-sc="B" onclick="pickScenario('B')">B 分时+扩容</button>
        <button type="button" class="seg-btn" data-sc="C" onclick="pickScenario('C')">C 实时+扩容</button>
      </div></div>
      <div><label>储能(MWh)</label><input type="number" id="d-cap" value="10" min="1" step="1" onchange="syncPower()" style="width:70px"></div>
      <div><label>功率(MW)</label><input type="number" id="d-pwr" value="5" min="0.5" step="0.5" style="width:70px"></div>
       <button class="btn primary" id="d-run" onclick="startRun()">发起调度</button>
    </div>
  </header>

  <div class="status-bar" id="status-bar">
    <span class="pill">等待发起调度</span>
  </div>

  <div id="main-content">
    <div class="empty">选择日期与目标，点击「发起调度」开始一次实时储能优化</div>
  </div>

  <footer>
    <span>energy_agent_v2 · LangGraph · FastAPI · 实时模式</span>
    <span id="footer-info"></span>
  </footer>
</div>
<div class="tooltip" id="tooltip"></div>

<script>
// 服务地址：通过 server 提供本页时用相对路径；双击打开(file://)时自动指向本地 8000
const API = location.protocol === 'file:' ? 'http://localhost:8000' : '';
const $ = id => document.getElementById(id);

// ---- 流程图节点定义（与 orchestration.py 的 graph 一致）----
const NODES=[
{id:'initialize_run',x:340,y:36,w:150,h:34,label:'初始化运行'},
{id:'load_inputs',x:340,y:96,w:150,h:34,label:'加载日前数据'},
{id:'compute_tariff',x:340,y:156,w:150,h:34,label:'电费核算'},
{id:'optimize_storage',x:340,y:216,w:150,h:34,label:'MILP 储能优化'},
{id:'compute_carbon',x:340,y:276,w:150,h:34,label:'电碳双因子计量'},
{id:'factory_summary',x:340,y:336,w:150,h:34,label:'审批摘要'},
{id:'human_approval',x:340,y:396,w:150,h:38,label:'人工审批'},
{id:'freeze_plan',x:150,y:396,w:130,h:34,label:'冻结方案'},
{id:'close_rejected',x:540,y:436,w:130,h:34,label:'关闭拒绝'},
{id:'apply_revision',x:560,y:336,w:130,h:34,label:'合并修改'},
{id:'parse_revision',x:560,y:296,w:130,h:34,label:'LLM 修改解析'},
{id:'fail_run',x:100,y:156,w:120,h:34,label:'失败关闭'},
];
const NODE_INFO={
initialize_run:{d:'创建运行上下文，锁定调度目标，初始化版本号和方案ID。'},
load_inputs:{d:'加载96点日前数据（负荷、电价、发电结构、储能参数）。'},
compute_tariff:{d:'按湖南分时电价核算日电度电费与月度需量电费。'},
optimize_storage:{d:'PuLP+CBC求解MILP。约束：SOC范围、爬坡率、热安全、末端SOC。'},
compute_carbon:{d:'直接因子C(τ)=发电结构加权平均；江亿责任因子Cr(τ)=C×(1+λ(C-C̄)/C̄)。'},
factory_summary:{d:'汇总收益、风险、检查项，生成工程师审批所需的决策摘要。'},
human_approval:{d:'LangGraph interrupt，暂停等待工程师决策。approve/reject/revise。'},
parse_revision:{d:'GLM-5解析工程师自然语言修改意见为结构化DispatchRevision。'},
apply_revision:{d:'合并审批修改（约束只收紧），版本递增，回到优化节点。'},
freeze_plan:{d:'方案批准后冻结，运行结束。'},
close_rejected:{d:'工程师拒绝，运行结束。'},
fail_run:{d:'任一节点出错时进入，记录错误并关闭。'},
};
const TYPE_LABEL={system:'系统节点',workflow:'工作流',agent:'Agent',human:'人工节点'};
const EDGES=[
{f:'initialize_run',t:'load_inputs'},
{f:'load_inputs',t:'compute_tariff',l:'ok'},{f:'load_inputs',t:'fail_run',l:'failed',dash:1},
{f:'compute_tariff',t:'optimize_storage',l:'ok'},{f:'compute_tariff',t:'fail_run',l:'failed',dash:1},
{f:'optimize_storage',t:'compute_carbon',l:'ok'},{f:'optimize_storage',t:'fail_run',l:'failed',dash:1},
{f:'compute_carbon',t:'factory_summary',l:'ok'},{f:'compute_carbon',t:'fail_run',l:'failed',dash:1},
{f:'factory_summary',t:'human_approval',l:'ok'},{f:'factory_summary',t:'fail_run',l:'failed',dash:1},
{f:'human_approval',t:'freeze_plan',l:'approve'},{f:'human_approval',t:'close_rejected',l:'reject'},
{f:'human_approval',t:'parse_revision',l:'revise'},{f:'parse_revision',t:'apply_revision'},
{f:'apply_revision',t:'optimize_storage',l:'重新优化',curve:1},
];

// ---- 状态 ----
let currentSnapshot=null, currentThreadId=null, busy=false;

// ---- 网络工具 ----
async function postJSON(path, body){
  const r = await fetch(API+path, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){ let m; try{m=(await r.json()).detail}catch(e){m=r.statusText} throw new Error(m||'请求失败') }
  return r.json();
}

// ---- 把 API 快照转成渲染用的 slim 结构 ----
function snapshotToSlim(s){
  const sr=s.storage_result||{}, tf=s.tariff_result||{}, cr=s.carbon_result||{}, ca=cr.carbon_accounting||{}, ib=s.input_bundle||{};
  return {
    objective:s.objective, run_status:s.run_status, plan_version:s.current_plan_version,
    price:ib.electricity_price_cny_per_kwh||[], load:ib.load_forecast_kw||[],
    battery_power:sr.battery_power_kw||[], soc:sr.soc_ratio||[], temp:sr.cell_temperature_c||[],
    C_factor:ca.direct_factor_c_kg_per_kwh||[], Cr_factor:ca.responsibility_factor_cr_kg_per_kwh||[],
    grid_base:sr.baseline_grid_import_power_kw||[], grid_opt:sr.grid_import_power_kw||[],
    saving:sr.energy_cost_saving_cny||0, peak_cut:sr.peak_reduction_kw||0, peak_base:sr.baseline_peak_demand_kw||0,
    max_temp:sr.max_cell_temperature_c||0, terminal_soc:sr.terminal_soc_ratio||0,
    direct_reduction:cr.direct_carbon_reduction_kg||0, resp_reduction:cr.responsibility_carbon_reduction_kg||0,
    tariff_energy:tf.energy_cost_cny||0, tariff_demand:tf.demand_cost_cny||0, tariff_gov_fund:tf.gov_fund_cost_cny||0,
    tariff_reactive:tf.reactive_adjustment_cny||0,
  };
}
function D(){ return snapshotToSlim(currentSnapshot||{}) }

// ---- 从 events 提取已执行的节点序列（用于流程图高亮）----
function activePath(){
  if(!currentSnapshot) return [];
  const seen=new Set(), path=[];
  (currentSnapshot.events||[]).forEach(e=>{ if(e.node_id && !seen.has(e.node_id)){seen.add(e.node_id);path.push(e.node_id)} });
  return path;
}

// ---- 渲染：流程图 ----
function renderGraph(){
  const path=activePath(), pathSet=new Set(path);
  let svg='<svg id="graph-svg" viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg">';
  const nm={};NODES.forEach(n=>nm[n.id]=n);
  EDGES.forEach(e=>{
    const a=nm[e.f],b=nm[e.t];
    let x1=a.x+a.w/2,y1=a.y+a.h,x2=b.x+b.w/2,y2=b.y,mx=(x1+x2)/2;
    if(e.curve){x1=a.x+a.w;y1=a.y+a.h/2;x2=b.x+b.w/2;y2=b.y;mx=x1+40}
    const pth=`M${x1},${y1} Q${mx},${(y1+y2)/2} ${x2},${y2}`;
    const active=pathSet.has(e.f)&&pathSet.has(e.t);
    const col=active?'#3dd9c4':'#2d3a33';
    svg+=`<path class="edge-line" d="${pth}" fill="none" stroke="${col}" stroke-width="${active?2:1}" stroke-dasharray="${e.dash?'4,3':''}" data-f="${e.f}" data-t="${e.t}" data-l="${e.l||''}" onmouseenter="edgeHover(event)" onmouseleave="hideTip()"/>`;
    if(e.l) svg+=`<text class="edge-label" x="${mx+4}" y="${(y1+y2)/2+3}" fill="${active?'#7a8a80':'#506058'}">${e.l}</text>`;
  });
  NODES.forEach(n=>{
    const active=pathSet.has(n.id);
    const fill=active?'#3dd9c4':'#1d2722', stroke=active?'#3dd9c4':'#28332d', tc=active?'#0e1410':'#7a8a80';
    svg+=`<rect class="node-rect" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="4" fill="${fill}" stroke="${stroke}" stroke-width="${active?1.5:1}" data-id="${n.id}" onmouseenter="nodeHover(event,'${n.id}')" onmouseleave="hideTip()"/>`;
    svg+=`<text x="${n.x+n.w/2}" y="${n.y+n.h/2+4}" text-anchor="middle" font-size="11" fill="${tc}" pointer-events="none" font-weight="${active?500:400}">${n.label}</text>`;
  });
  svg+='</svg>';
  $('graph-container').innerHTML=svg;
}
function nodeHover(ev,id){
  const n=NODE_INFO[id]; if(!n) return;
  const t=$('tooltip');
  t.innerHTML=`<strong>${NODES.find(x=>x.id===id).label}</strong>${n.d}`;
  showTip(ev,t);
}
function edgeHover(ev){
  const t=ev.target, l=t.getAttribute('data-l');
  const f=NODES.find(x=>x.id===t.getAttribute('data-f')).label;
  const tg=NODES.find(x=>x.id===t.getAttribute('data-t')).label;
  $('tooltip').innerHTML=`<span class="tt-type">条件边</span><strong>${f} → ${tg}</strong>${l||''}`;
  showTip(ev,$('tooltip'));
}
function showTip(ev,tip){tip.style.display='block';const r=ev.target.getBoundingClientRect();tip.style.left=Math.min(r.left,window.innerWidth-340)+'px';tip.style.top=(r.bottom+8)+'px'}
function hideTip(){$('tooltip').style.display='none'}

// ---- 渲染：KPI ----
function renderKPIs(){
  const d=D(), sv=d.saving, dr=d.direct_reduction, rr=d.resp_reduction;
  const k=(l,v,sub,c)=>`<div class="kpi"><div class="label">${l}</div><div class="val ${c||''}">${v}</div><div class="sub">${sub}</div></div>`;
  $('kpis').innerHTML=[
    k('日电度电费节省',(sv>=0?'+':'')+sv.toFixed(0)+' 元','占日电度'+(sv/(d.tariff_energy||1)*100).toFixed(1)+'%',sv>=0?'pos':'neg'),
    k('峰值削减',d.peak_cut.toFixed(0)+' kW',d.peak_cut>1?'基线'+(d.peak_base/1000).toFixed(1)+'MW':'峰值未触发',d.peak_cut>1?'pos':''),
    k('直接碳减排 C(τ)',(dr>=0?'+':'')+dr.toFixed(0)+' kg',dr>=0?'物理减碳':'碳排增加',dr>=0?'carbon':'neg'),
    k('责任碳减排 Cr(τ)',(rr>=0?'+':'')+rr.toFixed(0)+' kg','激励信号·非物理减排',rr>=0?'carbon':'neg'),
  ].join('');
}

// ---- 渲染：步骤链 ----
function renderSteps(){
  const evs=(currentSnapshot&&currentSnapshot.events)||[];
  $('steps-list').innerHTML=evs.map((e,i)=>{
    const human=e.node_id&&e.node_id.includes('human_approval');
    const failed=e.status==='failed';
    const cls=failed?'failed':(human?'human':'');
    const dur=e.duration_ms?(' · '+e.duration_ms+'ms'):'';
    return `<div class="step" data-step="${e.node_id}" onclick="stepClick('${e.node_id}')"><div class="step-dot ${cls}"></div><div><div class="st-title">${i+1}. ${nodeLabel(e.node_id)}</div><div class="st-detail">${e.summary||''}${dur}</div></div></div>`;
  }).join('');
}
function nodeLabel(id){const n=NODES.find(x=>x.id===id);return n?n.label:(id||'?')}
function stepClick(id){document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));const el=document.querySelector(`[data-step="${id}"]`);if(el)el.classList.add('active')}

// ---- 渲染：电费明细 ----
function renderTariff(){
  const d=D();
  const it=(l,v,n,c)=>`<div><span style="color:var(--fg2);font-size:11px">${l}</span><br><span class="mono" style="font-size:18px;color:${c||'var(--fg)'}">${v}</span> <span style="color:var(--fg3);font-size:11px">${n}</span></div>`;
  $('tariff-breakdown').innerHTML=[

    it('政府基金',d.tariff_gov_fund.toFixed(0)+' 元','(月固定)', 'var(--fg2)'),
    it('力调电费',d.tariff_reactive.toFixed(0)+' 元','(月·默认奖励)', 'var(--carbon)'),

// ---- 渲染：审批区（实时交互核心）----
function renderApproval(){
  const s=currentSnapshot, box=$('approval-box');
  if(!s){ box.style.display='none'; return; }
  if(s.paused && s.interrupt_type==='approval'){
    box.style.display='block';
    box.innerHTML=`<h3>审批待决 · 方案 V${s.current_plan_version}</h3>
      <div style="font-size:12px;color:var(--fg2)">系统已完成储能优化与电碳核算，等待工程师决策。可批准、拒绝，或提出修改意见后重新优化（版本将递增）。</div>
      <div class="approval-actions">
        <button class="btn approve" onclick="doDecision('approve')">批准并冻结</button>
        <button class="btn reject" onclick="doDecision('reject')">拒绝</button>
        <div class="field"><span style="font-size:11px;color:var(--fg2)">修改意见（自然语言，交 GLM-5 解析）</span>
        <textarea id="rv-comment" placeholder="如：末端SOC提到0.3，夜间23点后别放电"></textarea></div>
        <button class="btn revise" onclick="doRevise()">修改 → 重新优化</button>
      </div>`;
  } else if(s.paused && s.interrupt_type==='clarify'){
    box.style.display='block';
    const q=(s.interrupt&&s.interrupt.question)||'';
    box.innerHTML=`<h3>LLM 澄清提问</h3><div style="font-size:13px;margin-bottom:10px">${q}</div>
      <div class="approval-actions"><input id="cl-answer" placeholder="你的回答"><button class="btn primary" onclick="doAnswer()">提交回答</button></div>`;
  } else if(s.paused && s.interrupt_type==='fallback_form'){
    box.style.display='block';
    box.innerHTML=`<h3>结构化表单回退</h3><div style="font-size:12px;color:var(--fg2)">LLM 多轮未能解析，请直接填写修改参数（JSON）。</div>
      <div class="approval-actions"><textarea id="fb-revision" placeholder='{"terminal_soc_min_ratio":0.3}'></textarea><button class="btn revise" onclick="doFallback()">提交</button></div>`;
  } else {
    const dec=(s.approval_decision&&s.approval_decision.decision)||'';
    let tag='';
    if(s.run_status==='approved') tag='<span class="decision-tag approve">已批准 · 方案已冻结</span>';
    else if(s.run_status==='rejected') tag='<span class="decision-tag reject">已拒绝</span>';
    else if(dec) tag=`<span class="decision-tag ${dec}">${dec.toUpperCase()}</span>`;
    if(tag){
      box.style.display='block';
      box.innerHTML=`<h3>运行已结束</h3><div style="display:flex;gap:12px;align-items:center">${tag}<span class="mono" style="color:var(--fg2);font-size:12px">最终版本 V${s.current_plan_version}</span></div>`;
    } else { box.style.display='none'; }
  }
}

// ---- 渲染：洞察 ----
function renderInsight(){
  const d=D(), el=$('insight-note');
  let txt=`<strong>观测：</strong>目标 <span class="mono">${d.objective}</span> 下，方案 V${d.plan_version} 预计日省 ${d.saving.toFixed(0)} 元电度电费。直接碳减排 ${d.direct_reduction.toFixed(0)} kg，Cr 责任减排 ${d.resp_reduction.toFixed(0)} kg（激励信号，用于优化方向引导而非碳交易）。`;
  if(d.objective==='min_cost' && d.direct_reduction<0) txt+=` 注意：min_cost 下储能把负荷从低碳时段（白天光伏）转移到高碳时段（夜间煤电），碳排反而增加 ${Math.abs(d.direct_reduction).toFixed(0)} kg——这正是引入 min_carbon 目标与 Cr 因子的动机。`;
  el.innerHTML=txt;
}

// ---- Canvas 图表（复用模板逻辑）----
var CHART_DATA={};
function registerChart(id,series,opts){
  CHART_DATA[id]={series:series,opts:opts||{}};
  var cv=$(id); if(!cv) return;
  cv.onmousemove=function(e){
    var cd=CHART_DATA[id]; if(!cd) return;
    var rect=cv.getBoundingClientRect(), mx=e.clientX-rect.left;
    var n=cd.series[0].data.length, pw=cv.offsetWidth-(cd.opts.dualAxis?42:42)-12, pad_l=42;
    var idx=Math.round((mx-pad_l)/(pw/(n-1))); idx=Math.max(0,Math.min(n-1,idx));
    var hour=Math.floor(idx*15/60), min=(idx*15)%60;
    var parts=['<span class="tt-type">'+String(hour).padStart(2,'0')+':'+String(min).padStart(2,'0')+'</span>'];
    cd.series.forEach(function(s){var val=s.data[idx],unit=s.unit||'',vstr=Math.abs(val)>100?val.toFixed(0):val.toFixed(3);parts.push('<strong style="color:'+s.color+'">'+(s.name||'')+' '+vstr+'</strong> '+unit)});
    $('tooltip').innerHTML=parts.join('<br>'); $('tooltip').style.display='block';
    $('tooltip').style.left=Math.min(e.clientX+12,window.innerWidth-340)+'px'; $('tooltip').style.top=(e.clientY+12)+'px';
  };
  cv.onmouseleave=function(){$('tooltip').style.display='none'};
}
function drawChart(id,series,opts){
  opts=opts||{}; var cv=$(id), ctx=cv.getContext('2d'), dpr=window.devicePixelRatio||1;
  var w=cv.offsetWidth,h=cv.offsetHeight; cv.width=w*dpr; cv.height=h*dpr; ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  var pad=opts.dualAxis?{l:42,r:42,t:8,b:22}:{l:42,r:12,t:8,b:22}, pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;
  var n=series[0].data.length, x=function(i){return pad.l+(i/(n-1))*pw};
  function range(arr,fz){var mn=Math.min.apply(null,arr),mx=Math.max.apply(null,arr);if(fz!==false&&mn>0)mn=0;if(mx<0)mx=1;var r=mx-mn||1;mn-=r*0.08;mx+=r*0.08;return[mn,mx]}
  var leftS=opts.dualAxis?series.filter(function(s){return s.axis!=='right'}):series, rightS=opts.dualAxis?series.filter(function(s){return s.axis==='right'}):[];
  var ld=leftS.reduce(function(a,s){return a.concat(s.data)},[]);
  if(opts.thresholds)opts.thresholds.filter(function(t){return t.axis!=='right'}).forEach(function(t){ld.push(t.value)});
  var lr=range(ld,opts.forceZero);
  var rd=rightS.length?rightS.reduce(function(a,s){return a.concat(s.data)},[]):[0,1];
  var rr=range(rd,opts.forceZero);
  var yL=function(v){return pad.t+ph-(v-lr[0])/(lr[1]-lr[0])*ph}, yR=function(v){return pad.t+ph-(v-rr[0])/(rr[1]-rr[0])*ph};
  ctx.strokeStyle='#1d2722';ctx.lineWidth=1;
  for(var i=0;i<=4;i++){var yy=pad.t+ph*i/4;ctx.beginPath();ctx.moveTo(pad.l,yy);ctx.lineTo(w-pad.r,yy);ctx.stroke()}
  ctx.fillStyle='#506058';ctx.font='9px Consolas,monospace';
  for(var i=0;i<=4;i++){var yy=pad.t+ph*i/4,v=lr[1]-(lr[1]-lr[0])*i/4;ctx.fillText(v.toFixed(Math.abs(v)>100?0:2),4,yy+3)}
  if(opts.yLabel){ctx.save();ctx.translate(10,pad.t+ph/2);ctx.rotate(-Math.PI/2);ctx.fillStyle='#7a8a80';ctx.textAlign='center';ctx.fillText(opts.yLabel,0,0);ctx.restore()}
  if(opts.dualAxis){ctx.fillStyle='#7a8a80';for(var i=0;i<=4;i++){var yy=pad.t+ph*i/4,v=rr[1]-(rr[1]-rr[0])*i/4;ctx.fillText(v.toFixed(0),w-pad.r+4,yy+3)}}
  for(var h2=0;h2<=24;h2+=6){var xx=x(h2*4);ctx.fillText(h2+':00',xx-8,h-6)}
  series.forEach(function(s){var yf=(opts.dualAxis&&s.axis==='right')?yR:yL, base=(opts.dualAxis&&s.axis==='right')?rr[0]:lr[0];ctx.strokeStyle=s.color;ctx.lineWidth=1.8;ctx.beginPath();s.data.forEach(function(v,i){if(i===0)ctx.moveTo(x(i),yf(v));else ctx.lineTo(x(i),yf(v))});ctx.stroke();if(s.fill){ctx.lineTo(x(n-1),yf(base));ctx.lineTo(x(0),yf(base));ctx.closePath();ctx.fillStyle=s.fill;ctx.fill()}});
  if(opts.thresholds)opts.thresholds.forEach(function(th){var yf2=th.axis==='right'?yR:yL;ctx.strokeStyle=th.color;ctx.lineWidth=1;ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(pad.l,yf2(th.value));ctx.lineTo(w-pad.r,yf2(th.value));ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=th.color;ctx.fillText(th.label,w-pad.r-40,yf2(th.value)-3)});
}
function renderCharts(){
  var d=D(); if(!d.price.length) return;
  drawChart('c-price',[{data:d.price.slice(),color:'#f0a830'},{data:d.load.map(function(v){return v/1000}),color:'#7ab87a',fill:'rgba(122,184,122,.08)',axis:'right'}],{dualAxis:true,yLabel:'元/kWh',yLabelRight:'MW'});
  registerChart('c-price',[{data:d.price,color:'#f0a830',name:'电价',unit:'元/kWh'},{data:d.load.map(function(v){return v/1000}),color:'#7ab87a',axis:'right',name:'负荷',unit:'MW'}],{dualAxis:true});
  $('lg-price').innerHTML='<span><i style="background:#f0a830"></i>电价(左轴 元/kWh)</span><span><i style="background:#7ab87a"></i>负荷(右轴 MW)</span>';
  drawChart('c-storage',[{data:d.battery_power.map(function(v){return v/1000}),color:'#f0a830'},{data:d.temp.slice(),color:'#e8835f'},{data:d.soc.map(function(v){return v*100}),color:'#3dd9c4',axis:'right'}],{dualAxis:true,thresholds:[{value:45,color:'#e85f5f',label:'45C安全线',axis:'left'}],yLabel:'MW/°C',yLabelRight:'%'});
  registerChart('c-storage',[{data:d.battery_power.map(function(v){return v/1000}),color:'#f0a830',name:'功率',unit:'MW'},{data:d.temp,color:'#e8835f',name:'温度',unit:'°C'},{data:d.soc.map(function(v){return v*100}),color:'#3dd9c4',axis:'right',name:'SOC',unit:'%'}],{dualAxis:true});
  $('lg-storage').innerHTML='<span><i style="background:#f0a830"></i>功率MW</span><span><i style="background:#e8835f"></i>温度°C</span><span><i style="background:#3dd9c4"></i>SOC%</span>';
  if(d.C_factor.length){
    drawChart('c-carbon',[{data:d.Cr_factor.slice(),color:'#7ab87a'},{data:d.C_factor.slice(),color:'#3dd9c4'}],{forceZero:false,yLabel:'kgCO₂/kWh'});
    registerChart('c-carbon',[{data:d.Cr_factor,color:'#7ab87a',name:'Cr',unit:'kgCO₂/kWh'},{data:d.C_factor,color:'#3dd9c4',name:'C',unit:'kgCO₂/kWh'}],{forceZero:false});
    $('lg-carbon').innerHTML='<span><i style="background:#7ab87a"></i>Cr(τ) 责任因子</span><span><i style="background:#3dd9c4"></i>C(τ) 直接因子</span>';
  }
  drawChart('c-grid',[{data:d.grid_base.map(function(v){return v/1000}),color:'#506058'},{data:d.grid_opt.map(function(v){return v/1000}),color:'#3dd9c4'}]);
  registerChart('c-grid',[{data:d.grid_base.map(function(v){return v/1000}),color:'#506058',name:'基线',unit:'MW'},{data:d.grid_opt.map(function(v){return v/1000}),color:'#3dd9c4',name:'优化后',unit:'MW'}],{});
  $('lg-grid').innerHTML='<span><i style="background:#506058"></i>基线</span><span><i style="background:#3dd9c4"></i>优化后</span>';
}

// ---- 渲染：状态条 ----
function renderStatus(){
  const s=currentSnapshot, bar=$('status-bar');
  if(!s){ bar.innerHTML='<span class="pill">等待发起调度</span>'; return; }
  const status=s.run_status||'';
  let dot='<span class="dot ok"></span>', cls='run';
  if(s.paused){ dot='<span class="dot wait"></span>'; cls='warn'; }
  if(status==='failed'){ dot='<span class="dot err"></span>'; }
  const parts=[
    dot+`<span class="pill ${cls}">${status}</span>`,
    `<span class="pill">V${s.current_plan_version||1}</span>`,
    `<span class="pill mono">${s.thread_id||''}</span>`,
  ];
  if(s.paused && s.interrupt_type==='approval') parts.push('<span class="pill warn">等待审批</span>');
  bar.innerHTML=parts.join('');
}

// ---- 主渲染 ----
function renderAll(){
  if(!currentSnapshot){ $('main-content').innerHTML='<div class="empty">选择日期与目标，点击「发起调度」开始一次实时储能优化</div>'; renderStatus(); return; }
  ensureLayout();
  renderStatus();
  try{renderKPIs()}catch(e){console.error(e)}
  try{renderGraph()}catch(e){console.error(e)}
  try{renderSteps()}catch(e){console.error(e)}
  try{renderTariff()}catch(e){console.error(e)}
  try{renderApproval()}catch(e){console.error(e)}
  try{renderInsight()}catch(e){console.error(e)}
  try{renderCharts()}catch(e){console.error(e)}
  $('footer-info').textContent=(currentSnapshot.objective||'')+' · '+(currentSnapshot.run_status||'');
}

    <div id="kpis" class="kpis"></div>

      <div class="panel"><div class="panel-title">LangGraph 编排图 · 实时高亮</div><div id="graph-container"></div></div>

    </div>

    </div>
    <div class="chart-row">
      <div class="chart-box"><h3>电碳双因子 C(τ) / Cr(τ)</h3><canvas id="c-carbon"></canvas><div class="legend" id="lg-carbon"></div></div>
      <div class="chart-box"><h3>电网功率 基线 vs 优化</h3><canvas id="c-grid"></canvas><div class="legend" id="lg-grid"></div></div>

// ---- 交互动作 ----
const SCENARIOS={A:{price_mode:'tou',capacity:10,power:5},B:{price_mode:'tou',capacity:40,power:20},C:{price_mode:'rtp',capacity:40,power:20}};
let currentScenario='A';
function pickScenario(sc){currentScenario=sc;const p=SCENARIOS[sc];$('d-cap').value=p.capacity;$('d-pwr').value=p.power;document.querySelectorAll('.seg-btn').forEach(b=>b.classList.toggle('active',b.dataset.sc===sc));}
function syncPower(){const c=parseFloat($('d-cap').value)||10;$('d-pwr').value=(c/2).toFixed(1);}
async function startRun(){
  if(busy) return;
  const dt=$('d-date').value, obj=$('d-obj').value;
  if(!dt){ alert('请选择日期'); return; }
  const cap=parseFloat($('d-cap').value)*1000, pwr=parseFloat($('d-pwr').value)*1000;
  const body={target_date:dt,objective:obj,site_id:'huanghua',requested_by:'web',
    price_mode:SCENARIOS[currentScenario].price_mode,
    battery_override:{capacity_kwh:cap,max_charge_power_kw:pwr,max_discharge_power_kw:pwr}};
  setBusy(true,'计算中…');
  try{
    const s=await postJSON('/api/runs',body);
    currentSnapshot=s; currentThreadId=s.thread_id;
    layoutReady=false; renderAll();
  }catch(e){ alert('调度失败：'+e.message) }
  finally{ setBusy(false) }
}
async function doDecision(dec){
  if(busy) return; setBusy(true,'处理中…');
  try{
    const s=await postJSON('/api/runs/'+currentThreadId+'/resume',{decision:dec,decided_by:'web',comment:'web-'+dec});
    currentSnapshot=s; renderAll();
  }catch(e){ alert('操作失败：'+e.message) }
  finally{ setBusy(false) }
}
async function doRevise(){
  if(busy) return;
  const comment=$('rv-comment').value.trim();
  if(!comment){ alert('请填写修改意见'); return; }
  setBusy(true,'重新优化中…');
  try{
    const s=await postJSON('/api/runs/'+currentThreadId+'/resume',{decision:'revise',decided_by:'web',comment:comment});
    currentSnapshot=s; renderAll();
  }catch(e){ alert('修改失败：'+e.message) }
  finally{ setBusy(false) }
}
async function doAnswer(){
  if(busy) return; setBusy(true,'解析中…');
  try{
    const s=await postJSON('/api/runs/'+currentThreadId+'/resume',{answer:$('cl-answer').value||'yes'});
    currentSnapshot=s; renderAll();
  }catch(e){ alert('提交失败：'+e.message) }
  finally{ setBusy(false) }
}
async function doFallback(){
  if(busy) return; setBusy(true,'处理中…');
  try{
    const rev=JSON.parse($('fb-revision').value||'{}');
    const s=await postJSON('/api/runs/'+currentThreadId+'/resume',{revision:rev});
    currentSnapshot=s; renderAll();
  }catch(e){ alert('提交失败（检查JSON格式）：'+e.message) }
  finally{ setBusy(false) }
}
function setBusy(b,msg){
  busy=b; const btn=$('d-run');
  btn.disabled=b; btn.innerHTML=b?('<span class="spin"></span>'+(msg||'')):'发起调度';
}

// ---- 初始化 ----
function init(){
  const today=new Date(); today.setDate(today.getDate()+0);
  $('d-date').value=today.toISOString().slice(0,10);
}
init();
